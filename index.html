let selectedA = null;
let selectedB = null;

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  
  const HTC = ['Alachua', 'Brevard', 'Citrus', 'DeSoto', 'Flagler', 'Hardee', 'Hernando', 'Highlands', 'Hillsborough', 'Lake', 'Levy', 'Manatee', 'Marion', 'Orange', 'Osceola', 'Pasco', 'Pinellas', 'Polk', 'Putnam', 'Sarasota', 'Seminole', 'Sumter', 'Volusia'];
  const PAN = ['Bay', 'Calhoun', 'Escambia', 'Franklin', 'Gadsden', 'Gulf', 'Holmes', 'Jackson', 'Jefferson', 'Leon', 'Liberty', 'Okaloosa', 'Santa Rosa', 'Wakulla', 'Walton', 'Washington'];
  
  let lastRegion = null;
  
  COUNTIES.forEach((c, idx) => {
    let region = HTC.includes(c.name) ? 'HTC' : (PAN.includes(c.name) ? 'PAN' : null);
    
    if (region !== lastRegion && region) {
      const h = document.createElement('div');
      h.className = 'region-header';
      h.textContent = region === 'HTC' ? 'High-Tech Corridor' : 'NW Florida Panhandle';
      list.appendChild(h);
      lastRegion = region;
    }
    
    const row = document.createElement('div');
    row.className = 'county-row';
    row.innerHTML = `<div class="county-name">${c.name}</div>`;
    row.onclick = () => selectCounty(idx);
    list.appendChild(row);
  });
}

function selectCounty(idx) {
  if (selectedA === idx) selectedA = null;
  else if (selectedB === idx) selectedB = null;
  else if (selectedA === null) selectedA = idx;
  else if (selectedB === null) selectedB = idx;
  else { selectedA = selectedB; selectedB = idx; }
  
  updateUI();
}

function updateUI() {
  document.querySelectorAll('.county-row').forEach((row, i) => {
    row.classList.toggle('selected', i === selectedA || i === selectedB);
  });
  
  ['a', 'b'].forEach((slot, i) => {
    const idx = i === 0 ? selectedA : selectedB;
    const box = document.getElementById('sel-' + slot);
    const content = document.getElementById('sel-' + slot + '-content');
    if (idx !== null) {
      box.classList.add('filled');
      content.innerHTML = `<div class="sel-name">${COUNTIES[idx].name}</div><span class="sel-clear" onclick="clearSel('${slot}')">Clear ×</span>`;
    } else {
      box.classList.remove('filled');
      content.innerHTML = '<div class="sel-empty">Click a county to select</div>';
    }
  });
  
  renderComparison();
}

function clearSel(slot) {
  if (slot === 'a') selectedA = null;
  else selectedB = null;
  updateUI();
}

function renderComparison() {
  const empty = document.getElementById('parcom-empty');
  const grid = document.getElementById('hm-grid-wrap');
  
  if (selectedA === null || selectedB === null) {
    empty.style.display = 'block';
    grid.style.display = 'none';
    return;
  }
  
  empty.style.display = 'none';
  grid.style.display = 'block';
  
  const cA = COUNTIES[selectedA];
  const cB = COUNTIES[selectedB];
  
  let html = '<div class="hm-grid">';
  html += '<div class="hm-param" style="border-top:none;"></div>';
  html += `<div class="hm-header" style="border-top:none;">${cA.name}</div>`;
  html += `<div class="hm-header" style="border-top:none;">${cB.name}</div>`;
  
  PARAMETERS.forEach((param, i) => {
    const pA = cA.params[i];
    const pB = cB.params[i];
    
    html += `<div class="hm-param" onclick="toggleRow(${i})">${param}</div>`;
    
    [pA, pB].forEach(p => {
      html += '<div class="hm-cell">';
      if (p) {
        const color = RATING_COLOR[p.rating] || '#999';
        const bg = RATING_BG[p.rating] || '#f0f0f0';
        html += `<div class="rating-pill" style="background:${bg};color:${color};" onclick="toggleRow(${i})">${p.rating}</div>`;
        html += `<div class="justification-box" id="just-${i}"><div class="justification-text">${p.justification}</div></div>`;
      } else {
        html += '<div class="rating-pill" style="background:#f0f0f0;color:#999;">Not Covered</div>';
      }
      html += '</div>';
    });
  });
  
  html += '</div>';
  grid.innerHTML = html;
}

function toggleRow(idx) {
  const boxes = document.querySelectorAll(`#just-${idx}`);
  boxes.forEach(box => box.classList.toggle('open'));
}

renderList();
