<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap');

  .argo-masthead {

  #app {

  #body { display: flex; flex: 1; overflow: hidden; }

  .county-name { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; color: #1a1a1a; flex: 1; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #parcom-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .drop-zone { border: 1.5px dashed #ddd; border-radius: 3px; padding: 8px 12px; min-height: 52px; display: flex; flex-direction: column; justify-content: center; transition: border-color 0.15s, background 0.15s; }

  .drop-zone.filled { border-style: solid; border-color: #ccc; }
  .dz-role { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #bbb; margin-bottom: 2px; }
  .dz-name { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; line-height: 1.1; }

  .dz-clear { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #bbb; margin-top: 3px; cursor: pointer; display: inline-block; }

  #parcom-table-wrap { flex: 1; overflow-y: auto; padding: 0 16px 14px; }
  .hm-grid { display: grid; grid-template-columns: 152px 1fr 1fr; gap: 0; margin-top: 10px; }
  .hm-header { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; padding: 0 8px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .hm-param { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #555; padding: 8px 10px 8px 0; display: flex; align-items: flex-start; flex-direction: column; border-top: 1px solid #eee; cursor: pointer; }

  .hm-cell { padding: 8px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 1px solid #eee; }
  .rating-pill { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; padding: 4px 12px; border-radius: 2px; width: 100%; text-align: center; cursor: pointer; transition: filter 0.12s; }
  .rating-pill:hover { filter: brightness(0.92); }
  .justification-box { overflow: hidden; max-height: 0; transition: max-height 0.3s ease, opacity 0.2s ease; opacity: 0; width: 100%; }
  .justification-box.open { max-height: 300px; opacity: 1; }
  .justification-inner { border-top: 0.5px solid #eee; margin-top: 5px; padding-top: 6px; padding-bottom: 4px; }
  .justification-text { font-family: 'Barlow', sans-serif; font-size: 11px; color: #333; line-height: 1.5; margin: 0; text-align: left; }
  #parcom-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .es-label { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #ccc; }

  .argo-footer { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #9A9A96; text-align: center; padding: 10px 16px 14px; border-top: 0.5px solid #DCDCD8; background: #F2F2F0; }
  .argo-footer-bar { height: 3px; background: #C8102E; margin: 0 0 8px; }
  .color-key { display: flex; justify-content: center; gap: 20px; margin-top: 8px; }
  .key-item { display: flex; align-items: center; gap: 6px; }
  .key-swatch { width: 12px; height: 12px; border-radius: 2px; }
  .key-label { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6B68; }
</style>
</head>
<body>

<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">County parameter comparison</h2>

<div class="argo-masthead">
  <div class="argo-meta">Community Implications for Shipbuilding Revitalization Readiness<br>May 2026 • 47 Interviews Conducted</div>
</div>

<div id="app">
  <div id="body">
    <div id="leaderboard">
      <div id="lb-header"><span>County</span></div>
      <div id="lb-hint">Drag to compare</div>
      <div id="list"></div>
    </div>
    <div id="detail">
      <div id="parcom-view" style="display:flex;">
        <div id="drop-zones">
          <div class="drop-zone" id="dz-a" ondragover="dzOver(event,'a')" ondragleave="dzLeave('a')" ondrop="dzDrop(event,'a')">
            <div class="dz-role">County A</div>
            <div id="dz-a-content"><div class="dz-empty">Drop county here</div></div>
          </div>
          <div class="drop-zone" id="dz-b" ondragover="dzOver(event,'b')" ondragleave="dzLeave('b')" ondrop="dzDrop(event,'b')">
            <div class="dz-role">County B</div>
            <div id="dz-b-content"><div class="dz-empty">Drop county here</div></div>
          </div>
        </div>
        <div id="parcom-table-wrap">
          <div id="hm-grid-wrap"></div>
        </div>
        <div id="parcom-empty" style="display:flex;">
          <div class="es-label">Select two counties to compare</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="argo-footer">
  <div class="argo-footer-bar"></div>
  <div class="color-key">
    <div class="key-item">
      <div class="key-swatch" style="background: #4AA364;"></div>
      <div class="key-label">Green = Strong</div>
    </div>
    <div class="key-item">
      <div class="key-swatch" style="background: #F0C419;"></div>
      <div class="key-label">Yellow = Somewhat Strong</div>
    </div>
    <div class="key-item">
      <div class="key-swatch" style="background: #FF8C42;"></div>
      <div class="key-label">Orange = Not as Strong</div>
    </div>
  </div>
</div>

-housing-needs)."

let parcomA = null;
let parcomB = null;
let dragIdx = null;

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  
  // Define regions
  const HTC_COUNTIES = ['Alachua', 'Brevard', 'Citrus', 'DeSoto', 'Flagler', 'Hardee', 'Hernando', 'Highlands', 'Hillsborough', 'Lake', 'Levy', 'Manatee', 'Marion', 'Orange', 'Osceola', 'Pasco', 'Pinellas', 'Polk', 'Putnam', 'Sarasota', 'Seminole', 'Sumter', 'Volusia'];
  const PANHANDLE_COUNTIES = ['Bay', 'Calhoun', 'Escambia', 'Franklin', 'Gadsden', 'Gulf', 'Holmes', 'Jackson', 'Jefferson', 'Leon', 'Liberty', 'Okaloosa', 'Santa Rosa', 'Wakulla', 'Walton', 'Washington'];
  
  let lastRegion = null;
  
  COUNTIES.forEach((c, idx) => {
    // Determine current region
    let currentRegion = null;
    if (HTC_COUNTIES.includes(c.name)) currentRegion = 'HTC';
    else if (PANHANDLE_COUNTIES.includes(c.name)) currentRegion = 'PANHANDLE';
    
    // Add region header if region changes
    if (currentRegion !== lastRegion && currentRegion !== null) {
      const header = document.createElement('div');
      header.className = 'region-header';
      header.textContent = currentRegion === 'HTC' ? 'High-Tech Corridor' : 'NW Florida Panhandle';
      list.appendChild(header);
      lastRegion = currentRegion;
    }
    
    const row = document.createElement('div');
    row.className = 'county-row';
    row.draggable = true;
    row.innerHTML = `<div class="county-name">${c.name}</div>`;
    row.addEventListener('dragstart', () => { dragIdx = idx; row.classList.add('dragging'); });
    row.addEventListener('dragend', () => { row.classList.remove('dragging'); });
    list.appendChild(row);
  });
}

function dzOver(e, slot) {
  e.preventDefault();
  document.getElementById('dz-' + slot).classList.add('drag-over');
}

function dzLeave(slot) {
  document.getElementById('dz-' + slot).classList.remove('drag-over');
}

function dzDrop(e, slot) {
  e.preventDefault();
  dzLeave(slot);
  if (dragIdx === null) return;
  if (slot === 'a') parcomA = dragIdx;
  else parcomB = dragIdx;
  dragIdx = null;
  updateDropZones();
  renderParcom();
}

function updateDropZones() {
  const upd = (slot, idx) => {
    const dz = document.getElementById('dz-' + slot);
    const content = document.getElementById('dz-' + slot + '-content');
    if (idx !== null) {
      dz.classList.add('filled');
      content.innerHTML = `<div class="dz-name" style="color:#1A1A1A">${COUNTIES[idx].name}</div><span class="dz-clear" onclick="clearDZ('${slot}')">Clear &times;</span>`;
    } else {
      dz.classList.remove('filled');
      content.innerHTML = `<div class="dz-empty">Drop county here</div>`;
    }
  };
  upd('a', parcomA);
  upd('b', parcomB);
}

function clearDZ(slot) {
  if (slot === 'a') parcomA = null;
  else parcomB = null;
  updateDropZones();
  renderParcom();
}

function renderParcom() {
  const empty = document.getElementById('parcom-empty');
  const gridWrap = document.getElementById('hm-grid-wrap');
  
  if (parcomA === null || parcomB === null) {
    empty.style.display = 'flex';
    gridWrap.style.display = 'none';
    return;
  }
  
  empty.style.display = 'none';
  gridWrap.style.display = 'block';
  
  const cA = COUNTIES[parcomA];
  const cB = COUNTIES[parcomB];
  
  gridWrap.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'hm-grid';
  
  // Headers
  const hEl = (cls, style, html) => {
    const el = document.createElement('div');
    el.className = cls;
    if (style) el.style.cssText = style;
    if (html !== undefined) el.innerHTML = html;
    return el;
  };
  
  const hA = hEl('hm-header', 'color:#1A1A1A;border-top:none;');
  hA.innerHTML = cA.name;
  const hB = hEl('hm-header', 'color:#1A1A1A;border-top:none;');
  hB.innerHTML = cB.name;
  grid.append(hEl('hm-param', 'border-top:none;'), hA, hB);
  
  // Parameters
  PARAMETERS.forEach((paramName, i) => {
    const paramA = cA.params[i];
    const paramB = cB.params[i];
    
    const paramCell = hEl('hm-param', '', paramName);
    
    const makePillCell = (paramData) => {
      const cell = hEl('hm-cell', '', '');
      
      if (!paramData) {
        cell.innerHTML = '<div class="rating-pill" style="background:#f0f0f0;color:#999;">Not Covered</div>';
        return { cell, pill: null, justBox: null };
      }
      
      const pill = document.createElement('div');
      pill.className = 'rating-pill';
      const ratingColor = RATING_COLOR[paramData.rating] || '#999';
      const ratingBg = RATING_BG[paramData.rating] || '#f0f0f0';
      pill.style.cssText = `background:${ratingBg};color:${ratingColor};`;
      pill.textContent = paramData.rating;
      
      const justBox = document.createElement('div');
      justBox.className = 'justification-box';
      justBox.innerHTML = `<div class="justification-inner"><div class="justification-text">${paramData.justification}</div></div>`;
      
      cell.appendChild(pill);
      cell.appendChild(justBox);
      
      return { cell, pill, justBox };
    };
    
    const cellA = makePillCell(paramA);
    const cellB = makePillCell(paramB);
    
    let rowOpen = false;
    
    const toggleRow = () => {
      rowOpen = !rowOpen;
      if (cellA.justBox) {
        cellA.justBox.classList.toggle('open', rowOpen);
        if (cellA.pill) cellA.pill.style.borderRadius = rowOpen ? '2px 2px 0 0' : '2px';
      }
      if (cellB.justBox) {
        cellB.justBox.classList.toggle('open', rowOpen);
        if (cellB.pill) cellB.pill.style.borderRadius = rowOpen ? '2px 2px 0 0' : '2px';
      }
    };
    
    [paramCell, cellA.cell, cellB.cell].forEach(el => {
      el.addEventListener('click', toggleRow);
    });
    
    grid.append(paramCell, cellA.cell, cellB.cell);
  });
  
  gridWrap.appendChild(grid);
}

renderList();
